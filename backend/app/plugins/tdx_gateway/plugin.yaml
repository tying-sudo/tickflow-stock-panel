name: tdx_gateway
display_name: "TDX LAN Gateway"
runtime: none
entry: app.plugins.tdx_gateway.provider:TdxGatewayProvider
check: app.plugins.tdx_gateway.provider:availability
datasets: [daily, adj_factor, minute, realtime, depth5, financial, tick, full_minute]
api_key_env: TDX_GATEWAY_TOKEN
description: "通达信局域网只读网关（Windows TDX 主机，Bearer Token + IP 白名单）。提供：全市场日K（不复权，量转手、额转元）、事件法除权因子（front/none 收盘价比值，非 ForwardFactor 直写）、分钟K 1m~60m（/v1/kline 盘后通道，最早 2026-05-19）与当日盘中 1m 分时补拉（/v1/tickdata，常驻桥 ~80ms/只）、显式标的实时快照（全市场扇出，50 只/批，网关 TDX 侧 12 workers）、买卖五档快照（Buyp/Buyv/Sellp/Sellv，档位不全时 pytdx 五档兜底）、当日分笔成交明细（TDX 分笔协议，时间/价格/量/笔数/方向，最近交易日）与全量分钟 T+0 落盘（16:30 全市场冷启动 + 盘中标的池增量，本地 kline_minute 当日分区）。"
install_hint: "Deploy the tdx-gateway service on the Windows TDX VM, then set TDX_GATEWAY_TOKEN and optional TDX_GATEWAY_URL on the Tick Stock Panel host."
